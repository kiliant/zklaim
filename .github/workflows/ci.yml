name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux (x86_64)
            os: ubuntu-24.04
          - name: Linux (arm64)
            os: ubuntu-24.04-arm
          - name: macOS (arm64)
            os: macos-15
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config libgmp-dev libgcrypt20-dev libssl-dev

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install gmp libgcrypt openssl@3 pkgconf
          echo "OPENSSL_ROOT_DIR=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"

      - name: Configure
        # Exercise libsnark assertions and DEBUG witness diagnostics in CI.
        run: cmake -S . -B build -DCMAKE_CXX_FLAGS_RELWITHDEBINFO="-O2 -g -DDEBUG"

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: cmake --build build --target bttest

      - name: Run example
        working-directory: build/zklaim
        run: ./main

  container:
    name: Container (Arch Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Build image
        run: podman build -t zklaim .

      - name: Test
        run: podman run --rm zklaim
